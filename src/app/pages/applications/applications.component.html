<section>
    <h1>Submit Application</h1>

  <form class="app-form">
    <div class="app-form__grid">
      <div class="app-form__group">
        <label class="app-form__label" for="userName">Full Name</label>
        <input class="app-form__input" type="text" id="userName" name="userName" placeholder="John Doe">
      </div>

      <div class="app-form__group">
        <label class="app-form__label" for="userEmail">Email Address</label>
        <input class="app-form__input" type="email" id="userEmail" name="userEmail" placeholder="example@domain.com">
      </div>
    </div>

    <div class="app-form__group">
      <label class="app-form__label" for="courseSelect">Choose a Course</label>
      <select class="app-form__input" id="courseSelect" name="course">
        <option value="angular">Web Development with Angular</option>
        <option value="html-css">HTML5 and CSS3 Essentials</option>
        <option value="design">UI/UX Interface Design</option>
      </select>
    </div>

    <div class="app-form__actions">
      <button class="btn btn--primary" type="submit">Submit Application</button>
    </div>
    
  </form>
</section>
